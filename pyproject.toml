# 本文件定义 Seshat 的 Python 项目信息、运行依赖和测试配置。
[project]
name = "seshat"
version = "0.1.0"
description = "让每一次论文修改都成为课题组永远的财富"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "PyYAML>=6.0,<7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
