# 本文件保存项目运行变量及模型环境变量映射，后续配置可直接扩展。

# 启动时未传 --tenant/--user 则以游客身份运行：租户为 guest_tenant，用户为 guest_user_prefix-<时间码>。
identity:
  guest_tenant: guest
  guest_user_prefix: guest

sessions:
  root: backend/data_agent/sessions

agent_loop:
  max_steps: 12

context:
  budget:
    working_tokens: 32000
    output_reserve_tokens: 8000
    initial_chars_per_token: 2.0
    calibration_weight: 0.3
  compression:
    read_cleanup_trigger_ratio: 0.6
    read_cleanup_target_ratio: 0.3
    turn_compaction_trigger_ratio: 0.8
    turn_compaction_target_ratio: 0.5
    keep_recent_turns: 4
    retain_recent_turn_reads: 1
    summary_max_ratio: 0.1
    cleanup_after_turn_end: true
  review_state:
    outline_max_level: 2
    max_open_findings: 30
    finding_max_chars: 200

documents:
  section_heading_level: 1
  summary_cache_path: cache/section_summaries.json
  summary_max_chars: 300
  read_default_max_chars: 10000
  read_max_chars: 30000

logging:
  level: INFO
  path: logs/seshat.log
  max_bytes: 10485760
  backup_count: 5

current_model: KIMI-K26

models:
  KIMI-K26:
    api_key_env: KIMI-K26_API_KEY
    base_url_env: KIMI-K26_BASE_URL
    model_name_env: KIMI-K26_MODEL_NAME
    context_window_tokens: 262144
    parameters:
      max_completion_tokens: 8000
      extra_body:
        thinking:
          type: disabled
